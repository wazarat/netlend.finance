[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "../packages/sdk" }, { access = "read", path = "./" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "morpho-blue/=lib/metamorpho-v1.1/lib/morpho-blue/src/",
  "metamorpho/=lib/metamorpho-v1.1/src/",
  "bundler3/=lib/bundler3/src/",
  "morpho-blue-oracles/=lib/morpho-blue-oracles/src/",
  "morpho-blue-irm/=lib/morpho-blue-irm/src/",
  "public-allocator/=lib/public-allocator/src/",
  "solmate/=lib/bundler3/lib/permit2/lib/solmate/",
]

# Robinhood Chain testnet (Arbitrum Orbit), chain id 46630
[rpc_endpoints]
robinhood_testnet = "${RH_RPC_URL}"

[etherscan]
robinhood_testnet = { key = "no-key-needed", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }

[fmt]
line_length = 120

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[lint]
exclude_lints = ["block-timestamp", "unsafe-typecast", "erc20-unchecked-transfer", "unused-import", "unaliased-plain-import"]
